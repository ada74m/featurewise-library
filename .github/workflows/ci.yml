# Builds and tests the library on every pull request and push to main. Each push to main also packs the
# library as previews of Featurewise.Core and Featurewise.Hosting, at one version, and publishes them to
# nuget.org.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION_SUFFIX: preview.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build, warning-free
        run: dotnet build FeaturewiseProto.sln -warnaserror -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test FeaturewiseProto.sln --no-build

      - name: Pack
        run: dotnet pack FeaturewiseProto.sln -c Release -o out -p:VersionSuffix="$VERSION_SUFFIX" -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@v7
        with:
          name: Featurewise
          path: out/*.nupkg
          if-no-files-found: error

      # nuget.org trusts this workflow, by a trusted publishing policy for this repository and ci.yml, so
      # there's no key to keep: the login swaps the run's OIDC token for a short-lived API key.
      - name: Sign in to nuget.org
        if: github.event_name == 'push'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ada1974m

      - name: Publish to nuget.org
        if: github.event_name == 'push'
        run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"

      - name: Tag the commit
        if: github.event_name == 'push'
        run: |
          package=$(basename out/Featurewise.Core.*.nupkg .nupkg)
          version=${package#Featurewise.Core.}
          git tag "v$version"
          git push origin "v$version"
