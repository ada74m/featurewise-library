# Builds and tests the library on every pull request and push to main. Each push to main also packs the
# library as a preview of Featurewise.Core and publishes it to this account's GitHub Packages feed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION_SUFFIX: preview.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build, warning-free
        run: dotnet build FeaturewiseProto.sln -warnaserror -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test FeaturewiseProto.sln --no-build

      - name: Pack
        run: dotnet pack Featurewise -c Release -o out -p:VersionSuffix="$VERSION_SUFFIX" -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@v7
        with:
          name: Featurewise.Core
          path: out/*.nupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}"

      - name: Tag the commit
        if: github.event_name == 'push'
        run: |
          package=$(basename out/*.nupkg .nupkg)
          version=${package#Featurewise.Core.}
          git tag "v$version"
          git push origin "v$version"
